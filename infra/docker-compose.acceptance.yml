# Isolated, disposable acceptance stack; never shares the application's database volume.
name: stocktrend-phase5
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: ${ACCEPTANCE_DB_PASSWORD:?Generate a private acceptance env file}
      POSTGRES_DB: acceptance
    volumes:
      - acceptance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U acceptance -d acceptance"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: stocktrend-phase5-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://acceptance:${ACCEPTANCE_DB_PASSWORD}@db:5432/acceptance
      JWT_SECRET_KEY: ${ACCEPTANCE_JWT_SECRET:?Generate a private acceptance env file}
      ENVIRONMENT: acceptance
      AUTO_SYNC_ON_STARTUP: "false"
      CORS_ORIGINS: '["http://stocktrend-acceptance.localhost:3105"]'
    ports:
      - "127.0.0.1:8105:8000"
    volumes:
      - ../apps/ml/models:/app/apps/ml/models:ro
      - ../apps/ml/data:/app/apps/ml/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
  web:
    image: stocktrend-phase5-web:local
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://stocktrend-acceptance.localhost:8105
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3105:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  acceptance_pgdata:
