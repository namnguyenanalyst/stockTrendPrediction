[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
description = "FastAPI Backend cho hệ thống dự báo chứng khoán VN Stock"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "vn-stock",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 99
src = ["app"]

[tool.uv.sources]
vn-stock = { path = "../ml", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
