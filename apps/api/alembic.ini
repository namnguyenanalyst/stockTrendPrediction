# Alembic configuration for VN Stock API

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Prepend current directory to sys.path
prepend_sys_path = .

# Version locations
version_locations = alembic/versions

# Separator for version locations
version_path_separator = os

# Default database URL (overridden dynamically in alembic/env.py by settings.async_db_url)
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/vn_stock

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
